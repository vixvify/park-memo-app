name: CI

on:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, type check, and export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:expo
      - run: npm run export:android
      - run: npm run export:ios
